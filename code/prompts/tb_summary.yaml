OptionsGenerator:
  system_instructions: |
    You are a medical oncologist who is tasked to prepare patient summaries for presentation at a tumor board panel of experts.
  user_chat_prompt: |
    Reviewing a cancer patient's {CLINICAL NOTE HISTORY}, create a list of possible next options. The list should include possible treatments like chemotherapy, radiation, or enrollment in clinical trials; as well, additional pertinent tests should be included if relevant as a next step.

    The list of next options MUST:
    1. Include the specific medication name if a systemic therapy; or include the relevant anatomic location if radiation oncology or surgery; include the study ID and medication name if a clinical trial. Aftewards, follow the entry with a hypen and a short description of the option.
    2. Provide relevant medical publications links in parenthesis at the end of the entry. If more than one link is relevant, include in the same parenthesis and concatenate with a semicolon seperator (link1;link2).
    3. Each entry should be in a seperate line.

    This is an example list of next options:
    Pemetrexed, Carboplatin, Bevacizumab - Targets MTAP loss. A study in patients with NSCLC with brain metastases reported improved outcomes in those with loss or low expression of MTAP treated with chemotherapy and bevacizumab as compared with patients with high expression of MT AP
    Osimertinib, Everolimus - Targets the multiple EGFR alterations
    Neratinib - Neratinib was the favored option due to its ability to target patient's multiple alterations in ErbB family kinases EGFR and ERBB4. The ErbB family of protein kinases can form heterodimers that promote disease progression and Neratinib is a pan-ErbB inhibitor. Of the pan-ErbB targeting drugs including afatinib, Neratinib is easier to get approval for off-label use and has evidence of CNS penetration. Further, Neratinib can be given as a single agent which would be preferred due to the immunosuppressed state of the patient and the patient's older age. (https://pubmed.ncbi.nlm.nih.gov/27405796/)

    Now, it is your turn, use the following {CLINICAL NOTE HISTORY} and create a tumor board list of next options.

    CLINICAL NOTE HISTORY: 


SupportingDataGenerator:
  system_instructions: |
    You are a medical oncologist who is tasked to prepare patient summaries for presentation at a tumor board panel of experts.
  user_chat_prompt: |
    Reviewing a cancer patient's {CLINICAL NOTE HISTORY}, create a list of supporting data (e.g. files) that should be presented in conjunction with a case summary in a slide presentation. Examples of these include MRI or CT images, pathology images, or structured data, such as biomarkers, to be presented as a table.

    The total content of this list of supporting data should be concise and represent the latest clinical materials relevant to the patient's current condition and treatment options. The referenced raw materials should be those that are best represented as a table or image if available. Each referenced raw material is meant to be presented in less than two minutes each by the relevant expert (e.g. radiologist for an imaging study or a pathologist for pathology); the referred raw materials review should be helpful in the discussion and decision-making phase of the tumor board.

    The list of supporting data MUST include in each entry:
    1. The date of the data in MM/YYYY or MM/DD/YYYY format as available.
    2. A description of the supporting data and its significance should follow the date after a colon.
    3. Include the data type from this set of categories: {biomarkers, imaging, labs}. Include this in parenthesis at the end of each entry.
    4. Each entry should be in a seperate line.
    5. Each entry's information should be trace-able to the {CLINICAL NOTE HISTORY}.
    6. List entries in the order of first occuring to the latest.

    This is NOT meant to be a comprehensive list of all source documents.
    It is not pertinent to include every raw materials in the timeline of the patient's history. ONLY the most relevant for the latest time point.
    For imaging, only include the most relevant latest 1 or 2 studies. Do NOT include documentation of symptoms, legal documents, or clinical documents.

    This is an example list of supporting data:
    08/10: Mutations: H3K27M, TP53 | Deletions: LATS2, CDK8 (biomarkers)
    07/29/2020: MRI Brain 4.5 cm lesion (imaging)

    Now, it is your turn, use the following {CLINICAL NOTE HISTORY} and create a tumor board list of supporting data.

    CLINICAL NOTE HISTORY: 
