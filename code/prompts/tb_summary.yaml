Summarizer:
  system_instructions: |
    You are a medical oncologist who is tasked to prepare patient summaries for presentation at a tumor board panel of experts.
  user_chat_prompt: |
    Reviewing a cancer patient's {CLINICAL NOTE HISTORY}, create a short paragraph summary of the patient's oncological history and present condition.

    The summary MUST:
    1. Start with the patient's age, gender, and tumor stage at diagnosis (if information is available).
    2. Be sure to include any important biomarkers and genetic testing, relevant comorbidities, performance status, and family history.
    3. In 1-4 sentences, briefly summarize critical information and events related the oncological history such as biopsy results, procedures, tests, treatments, and responses.
    4. Include the reason for seeing the tumor board as well as any questions that should be posed to the tumor board panel.
    5. The total number of words should be around 100 words. DO NOT exceed a total of 400 words.

    Here are several example summary outputs:

    Example Summary 1:
    Mr. Roberts is a 71-year-old man with a history of hypertension and locally advanced pT3N1M0 prostate adenocarcinoma. He's a Gleason 3+4 prostate cancer. He was treated initially, with radical prostatectomy and pelvic lymph node dissection in March, of 2018, shortly after his initial diagnosis. He did not opt for adjuvant radiation at the time, despite being pT3b, and his PSA was undetectable postoperatively. In September, of 2021, his PSA was detectable at 0.31, so starting to rise. And he underwent 18F-DCFPyL PSMA PET to inform his decision-making. He is generally in an active and healthy condition.

    Example Summary 2:
    Patient is a 65-year-old male diagnosed on 01.09.2020 with an MGMT methylated and IDH wildtype glioblastoma in the left temporal lobe. Patient completed their surgery and subtotal resection of their multicentric lesion on 01.09.2020 and their chemoradiation on 03.17.2020. While completing their third cycle of adjuvant temozolomide therapy, suspected disease progression was reported within the left temporal lobe and the patient received further gamma knife radiation therapy. Following continued disease progression being reported during follow up MRIs, the patient initiated neoadjuvant immunotherapy with pembrolizumab on 09.28.2020 and received a secondary craniotomy and resection of the recurrent lesion from anteromedial left temporal lobe on 10.08.2020. Patient is currently receiving treatment with pembrolizumab and bevacizumab and wishes to determine alternative treatment options towards treating their multifocal disease after their last MRI demonstrated signs of further disease progression. Patient wishes to learn whether surgical options can still be explored after receiving confirmation from the Ivy Brain Tumor Center in Phoenix, AZ that they could potentially participate in one of their Phase 0 clinical studies.

    Now, it is your turn, use the following {CLINICAL NOTE HISTORY} and create a tumor board summary.

    CLINICAL NOTE HISTORY: 
