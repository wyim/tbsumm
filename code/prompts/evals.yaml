TBFactContextEntailmentClassifier:
  system_instructions: |
    You are a medical annotator with expertise in medical oncology.
  user_chat_prompt: |
    Given (1) a piece of text (SOURCE TEXT) and a list fact events (FACT EVENTS), and (2) a context text (CONTEXT TEXT), your task is to classify the "mention" and each of "attributes" of the {FACT EVENT} for entailment by the context text ({CONTEXT TEXT}).

    The entailment classifications are between a {HYPOTHESIS} text and a {CONTEXT TEXT} is defined below:
    1. ENTAILED_BY - {HYPOTHESIS} text is entailed by {CONTEXT TEXT}, if {HYPOTHESIS} can be logically inferred from {CONTEXT TEXT}.
    2. CONTRADICTED_BY - {HYPOTHESIS} text is contradicted by {CONTEXT TEXT}, if {CONTEXT TEXT} information contradicts information in {HYPOTHESIS}.
    3. RELEVANT_BUT_NOT_SUPPORTED - {HYPOTHESIS} text is relevant but not supported by {CONTEXT TEXT}, if {HYPOTHESIS} and {CONTEXT TEXT} are related text but {HYPOTHESIS} cannot be inferred from {CONTEXT TEXT}.
    4. OTHER_NOT_SUPPORTED - {HYPOTHESIS} text is otherwise not supported by {CONTEXT TEXT}, if {HYPOTHESIS} and can not be logically inferred from {CONTEXT TEXT} and does not fall in the previous categories.

    As an example, consider the followint text examples:
    text1: "BP 138/82"
    text2: "BP 129/60"
    text3: "blood pressure was high"
    text4: "history of hypertension"
    text5: "high blood sugars"

    Consider the following are examples of the {HYPOTHESIS}, {CONTEXT TEXT} => classifications; reason:
    "BP 138/82", "BP 129/60" => CONTRADICTED_BY; BP cannot be 138/82 and 129/60 at the same time
    "BP 129/60", "BP 138/82" => CONTRADICTED_BY; BP cannot be 129/60 and 138/82 at the same time
    "BP 138/82", "blood pressure was high" => RELEVANT_BUT_NOT_SUPPORTED; given "high blood pressure" we cannot infer the actual blood pressure measurement
    "blood pressure was high", "BP 138/82" => ENTAILED_BY; given a blood pressure of 138/82 based on medical defintions, blood pressure is considered high
    "BP 138/82", "history of hypertension" => RELEVANT_BUT_NOT_SUPPORTED; given information that there is a history of hypertension, it is not possible to infer a single specific blood pressure reading of 138/82. however a history of hypertension suggests that the same individual will have high blood pressure readings such as 138/82.
    "history of hypertension", "BP 138/82" => RELEVANT_BUT_NOT_SUPPORTED; given a single blood pressure reading that is considered medically high, it is not possible to infer a hystery of hypertension. however many such high blood pressure readings for the same individuals defines a history of hypertenstion.
    "BP 138/82", "high blood sugars" => OTHER_NOT_SUPPORTED; given blood sugar readings, it is not possible to infer any information related to blood pressure
    "high blood sugars", "BP 138/82" => OTHER_NOT_SUPPORTED; given blood pressure readings, it is not possible to infer any information related to blood sugars

    Instructions:
    1. You will be given a list of {FACT EVENT} as a list of json objects. "text" comes from {SOURCE TEXT} as an extractive summary. The "mention" is the representative phrase of the {FACT EVENT} and "attributes" are a list of characteristics describing the "mention", including anatomic location, severity, time and temporal aspects, negations, or other descriptions and characteristics.
    2. Reading the {CONTEXT TEXT}, determine the entailment classification of the "mention" and each of the "attributes". Return the classifications in a new object with the mention classification in the "mention_classification" key, the attributes classifications in the "attribute_classifications" key. The number of "attribute_classifications" should match the number of items in the original "attributes".

    Specifically, classify the "mention" as {HYPOTHESIS} text against the {CONTEXT TEXT} for entailment. Save this classification with the "mention_classification" key of a new json object. Next for each "attribute" in the list of "attributes", use each item as as the {HYPOTHESIS} text and the {CONTEXT TEXT} as the context text. Save the results in a list of string with the "attribute_classifications" in the same json object.

    3. Make sure to align the same event from the {SOURCE TEXT}, {FACT EVENT}, and {CONTEXT TEXT} by comparing the events chronically. Some events within or between the {SOURCE TEXT} or {CONTEXT TEXT} may have the same name (e.g. multiple MRI or pathology), but are not related; on the other hand, there may be incorrect attributes describing the same event that should be aligned.

    For example: 

    4. For each {FACT EVENT CLASSIFICATION}, there should be exactly one mention, mention_classification, mention_classification_reason.
    5. For each {FACT EVENT CLASSIFICATION}, the number of attributes should match the number of attribute_classifications, and the number of attribute_classifications_reasons.

    Here is an example:

    EXAMPLE 1 SOURCE TEXT:
    Mr. Roberts is a 71-year-old man with a history of hypertension and locally advanced pT3N1M0 prostate adenocarcinoma. He's a Gleason 3+4 prostate cancer. He was treated initially, with radical prostatectomy and pelvic lymph node dissection in March, of 2018, shortly after his initial diagnosis. He did not opt for adjuvant radiation at the time, despite being pT3b, and his PSA was undetectable postoperatively. In September, of 2021, his PSA was detectable at 0.31, so starting to rise. And he underwent 18F-DCFPyL PSMA PET to inform his decision-making. He is generally in an active and healthy condition.

    EXAMPLE 1 FACT EVENTS:
    [
      { "text":"71-year-old man", "type":"demographics", "mention":"71-year-old man", "attributes":[] },
      { "text":"hypertension", "type":"symptoms", "mention":"hypertension", "attributes":[] },
      { "text":"pT3N1M0", "type":"stage", "mention":"pT3N1M0", "attributes":[] },
      { "text":"prostate adenocarcinoma", "type":"diagnosis", "mention":"adenocarcinoma", "attributes":["prostate"] },
      { "text":"Gleason 3+4", "type":"testresult_pathology", "mention":"Gleason 3+4", "attributes":[] },
      { "text":"treated initially, with radical prostatectomy", "type":"treatment_surgery", "mention":"radical prostatectomy", "attributes":["initially"] },
      { "text":"pelvic lymph node dissection in March, of 2018, shortly after his initial diagnosis", "type":"", "mention":"dissection", "attributes":["pelvic lymph node", "March, of 2018", "after his initial diagnosis"] },
      { "text":"did not opt for adjuvant radiation at the time", "type":"treatment_radiation", "mention":"adjuvant radiation", "attributes":["did not opt for", "at the time"] },
      { "text":"PSA was undetectable postoperatively", "type":"testresult_labs", "mention":"PSA", "attributes":["undetectable","postoperatively"] },
      { "text":"September, of 2021, his PSA was detectable at 0.31", "type":"testresult_labs", "mention":"PSA", "attributes":["September, of 2021","detectable","0.31","starting to rise"] },
      { "text":"underwent 18F-DCFPyL PSMA PET", "type":"test_imaging", "mention":"PET", "attributes":["18F-DCFPyL PSMA"] },
      { "text":"generally in an active and healthy condition", "type":"other", "mention":"active and healthy", "attributes":[] },
    ]

    EXAMPLE 1 CONTEXT TEXT:
    71M male with locally advanced pT3N1M0 prostate adenocarcinoma, Gleason 3+4. Initially underwent radical prostatectomy and pelvic lymph node dissection, 03/2018. PSA was undetectable postoperatively. In September 2022, his PSA was detectable at 0.31. 18F-DCFPyL PSMA PET performed with results pending. He is active and healthy, running 6 miles/day, 5x/week. He mentions he prefers proactive aggressive treatment.

    EXAMPLE 1 FACT EVENT CLASSIFICATIONS:
    [
      { "mention":"71-year-old man", "attributes":[],
        "mention_classification":"ENTAILED_BY", "mention_classification_reason": "given 71M, we can infer 71-year-old-man", "attribute_classifications":[], "attribute_classifications_reasons": [] },
        
        { "mention":"hypertension", "attributes":[],
          "mention_classification":"OTHER_NOT_SUPPORTED", "mention_classification_reason": "hypertension is not mentioned", "attribute_classifications":[], "attribute_classifications_reasons": [] },
          
        { "mention":"pT3N1M0", "attributes":[],
